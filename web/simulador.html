<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Muévete CB — Sala en vivo (multiusuario)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,500,0..1,0&display=block" />
  <link rel="stylesheet" href="css/styles.css?v=14" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <style>
    body { padding-bottom: 0; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
    .sim-top { background: var(--morado); border-bottom: 4px solid var(--verde); color: #fff; position: sticky; top: 0; z-index: 1100; }
    .sim-top-in { max-width: 1440px; margin: 0 auto; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px 16px; }
    .sim-top h1 { font-size: 18px; display: flex; align-items: center; gap: 6px; }
    .sim-top p { font-size: 12px; opacity: .9; }
    .sim-controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    .sim-controls button, .sim-controls a { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; background: #fff; color: var(--morado); border: none; padding: 8px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    .sim-controls .alt { background: #ffffff26; color: #fff; }
    .sim-controls .alt:hover { background: #ffffff40; }

    .sim-grid { flex: 1; width: 100%; max-width: 1440px; margin: 0 auto; display: grid; grid-template-columns: 1fr; gap: 14px; padding: 14px 16px; }
    .sim-map { background: #fff; border-radius: var(--r-lg); padding: 10px; box-shadow: var(--sombra); display: flex; flex-direction: column; min-width: 0; }
    .sim-map-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 13px; }
    .sim-map-head strong { display: flex; align-items: center; gap: 4px; }
    #mapa { height: 55vh; min-height: 280px; border-radius: var(--r); background: var(--morado-50); z-index: 0; }
    #mapaSvg { width: 100%; height: 55vh; background: var(--morado-50); border-radius: var(--r); display: none; }
    .feed { max-height: 22vh; overflow-y: auto; margin-top: 8px; font-size: 12px; }
    .feed div { padding: 4px 0; border-bottom: 1px dashed var(--borde); display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .feed:empty::before { content: "No hay reportes en la última hora: toca un botón de un vecino o «Simular actividad»."; color: var(--gris); }
    .feed div { cursor: pointer; }
    .feed div.vencido { opacity: .55; }
    .sala-estado { display: flex; align-items: center; justify-content: center; gap: 6px; background: var(--warn-bg); color: var(--warn); font-weight: 600; font-size: 13px; padding: 8px 16px; }
    .sala-estado[hidden] { display: none; }
    .user .uinfo { display: flex; align-items: center; gap: 2px; font-size: 11px; color: var(--gris); margin-bottom: 6px; }
    .user .ustars { margin-left: auto; }
    .user .quick button:disabled { opacity: .45; cursor: not-allowed; }

    /* max-content: las tarjetas (overflow:hidden) no se encogen cuando la columna tiene alto fijo */
    .users { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); grid-auto-rows: max-content; gap: 12px; align-content: start; min-width: 0; }
    .user { border-radius: var(--r-lg); overflow: hidden; box-shadow: var(--sombra); background: #fff; display: flex; flex-direction: column; }
    .user .uhead { padding: 8px 12px; color: #fff; display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .user .uhead strong { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .user.wa .uhead { background: var(--navy); } .user.web .uhead { background: var(--morado); }
    .user .canal { display: inline-flex; align-items: center; gap: 3px; margin-left: auto; flex: none; font-size: 10px; background: #ffffff33; padding: 2px 8px; border-radius: 12px; }
    .user .ubody { padding: 10px; flex: 1; }
    .user .quick { display: flex; flex-wrap: wrap; gap: 6px; }
    .user .quick button { display: inline-flex; align-items: center; gap: 4px; border: none; border-radius: 10px; padding: 7px 9px; min-height: 32px; font-size: 12px; font-weight: 700; cursor: pointer; color: #fff; }
    .user .last { font-size: 11px; color: var(--gris); margin-top: 8px; min-height: 26px; display: flex; align-items: center; gap: 2px; }

    /* PC: mapa fijo a la izquierda ocupando el alto libre; vecinos a la derecha con su propio scroll */
    @media (min-width: 900px) {
      body { height: 100vh; height: 100dvh; overflow: hidden; }
      .sim-grid { grid-template-columns: minmax(0, 1.5fr) minmax(300px, 1fr); min-height: 0; overflow: hidden; }
      .sim-map { min-height: 0; }
      #mapa, #mapaSvg { flex: 1; height: auto; min-height: 0; }
      .feed { flex: none; max-height: 18vh; }
      .users { overflow-y: auto; min-height: 0; padding: 2px 4px 8px 2px; }
    }
    /* Los avisos salen debajo de la barra superior, sin tapar los controles */
    .toasts { top: calc(var(--sim-top-h, 72px) + 10px); }
    @media (max-width: 520px) {
      .sim-top h1 { font-size: 16px; }
      .sim-controls { width: 100%; }
      .sim-controls button, .sim-controls a { flex: 1; justify-content: center; }
    }
  </style>
</head>
<body>
  <header class="sim-top">
    <div class="sim-top-in">
      <div>
        <h1><span class="ms fill" aria-hidden="true">groups</span> Sala en vivo — Muévete <span class="cb">CB</span></h1>
        <p>Varios vecinos reportando y calificándose a la vez. Todo se guarda en el servidor y lo ve toda la app.</p>
      </div>
      <nav class="sim-controls" aria-label="Controles de la sala">
        <button id="btnAuto" type="button"><span class="ms fill" aria-hidden="true">play_arrow</span>Simular actividad</button>
        <a href="index.html" class="alt"><span class="ms" aria-hidden="true">arrow_back</span>Volver a la app</a>
      </nav>
    </div>
  </header>

  <p id="salaEstado" class="sala-estado" role="status" hidden><span class="ms" aria-hidden="true">cloud_off</span>Sin conexión con el servidor: los reportes se guardan allá. Reintentando…</p>

  <main class="sim-grid">
    <section class="sim-map" aria-label="Mapa vivo compartido">
      <div class="sim-map-head">
        <strong class="map-title"><span class="ms" aria-hidden="true">map</span>Mapa vivo compartido</strong>
        <span id="incCount" class="pill" style="background:var(--morado-100);color:var(--morado)">0 alertas</span>
      </div>
      <div id="mapa" role="img" aria-label="Mapa de Ciudad Bolívar con las alertas de la sala"></div>
      <svg id="mapaSvg" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="feed" id="feed" aria-live="polite"></div>
    </section>
    <section class="users" id="users" aria-label="Vecinos de la sala"></section>
  </main>

  <div id="toasts" class="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/reports.js"></script>
  <script src="js/api.js"></script>
  <script src="js/sim.js"></script>
  <script>
    // Alto real de la barra (cambia al envolverse en pantallas angostas) para ubicar los avisos
    const barra = document.querySelector('.sim-top');
    new ResizeObserver(() => document.documentElement.style.setProperty('--sim-top-h', barra.offsetHeight + 'px')).observe(barra);
  </script>
</body>
</html>
