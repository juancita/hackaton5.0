# Plantilla de nginx para la web de Muévete CB. ${BACKEND_URL} se reemplaza al arrancar el contenedor.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # --- API: mismo origen para el navegador; nginx la reenvía al backend ---
    location ~ ^/(health|network|places|routes|mapas|chat|webhooks|incident-types|incidents|reporters|admin|auth|me|conductores|viajes|stats|cameras|integraciones|docs|redoc|openapi\.json)(/|$) {
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # El asistente con LLM puede tardar varios segundos
        proxy_read_timeout 90s;
        proxy_connect_timeout 5s;
        client_max_body_size 5m;
    }

    # --- Estáticos ---
    # El service worker y el manifest no deben quedar cacheados por el navegador
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    # JS y CSS se revalidan siempre (ETag → 304): tras un despliegue nadie se queda con código viejo
    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location ~* \.(png|jpg|jpeg|svg|webp|ico|woff2?)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
