# Postgres para el feedback (reportes, votos, reputación) + API opcional.
#   Solo BD:       docker compose up -d db
#   BD + API:      docker compose --profile api up -d --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: muevete
      POSTGRES_PASSWORD: muevete
      POSTGRES_DB: muevete
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muevete -d muevete"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: ["api"]
    build: ./backend
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://muevete:muevete@db:5432/muevete
      STORAGE: postgres
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
